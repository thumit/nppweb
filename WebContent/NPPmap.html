<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D GACC Map - Executive GIS Style (v04 Modular)</title>
  
  <link rel="stylesheet" href="css/style.css">

  <!-- Core Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="labels-container"></div>

  <!-- Interactive Overlay Panel -->
  <div class="gis-panel">
    <h3>Annual Resource Movement Projection</h3>

    <div class="file-input-wrapper" onclick="document.getElementById('fileInput').click()">
      <span class="file-input-btn" id="fileStatusLabel">📁 Load Other CSV File</span>
      <input type="file" id="fileInput" accept=".csv" />
    </div>

    <div class="form-group">
      <label>Focus GACC</label>
      <select class="form-control" id="gaccSelect">
        <option value="NWCC">NWCC</option>
        <option value="OSCC">OSCC</option>
        <option value="ONCC">ONCC</option>
        <option value="NRCC">NRCC</option>
        <option value="GBCC">GBCC</option>
        <option value="SWCC">SWCC</option>
        <option value="RMCC">RMCC</option>
        <option value="AICC">AICC</option>
        <option value="EACC">EACC</option>
        <option value="SACC">SACC</option>
      </select>
    </div>

    <div class="form-group">
      <label>Resource Type</label>
      <select class="form-control" id="resSelect">
        <!-- Dynamic Options -->
      </select>
    </div>

	<div class="form-group">
	  <label>Flow Direction</label>
	  <select class="form-control" id="dirSelect">
	    <option value="all">All Flows (Local, Export, Import)</option>
	    <option value="local">Local Use Only</option>
	    <option value="outbound">Exportation Only</option>
	    <option value="inbound">Importation Only</option>
	  </select>
	</div>

    <div class="kpi-container">
      <div class="kpi-card">
        <div class="kpi-val" id="kpiLocalUse">0</div>
        <div class="kpi-lbl">Local Use</div>
        <div class="kpi-subdesc">Home resources used in the home GACC</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-val outbound-val" id="kpiExportation">0</div>
        <div class="kpi-lbl">Exportation</div>
        <div class="kpi-subdesc">Home resources sent to other GACCs</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-val inbound-val" id="kpiImportation">0</div>
        <div class="kpi-lbl">Importation</div>
        <div class="kpi-subdesc">Resources from other GACCs received by the home GACC</div>
      </div>
    </div>
  </div>

  <div id="instructions">
    Rotate: Left Drag | Pan: Right Drag | Zoom: Scroll
  </div>

  <!-- Main ES6 Application Script -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
